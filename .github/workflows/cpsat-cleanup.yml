name: CP-SAT learned clause cleanup

on:
  push:
    branches:
      - cpsat-minizinc2026-research

jobs:
  clause-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: bazel-contrib/setup-bazel@0.15.0
      - name: Run focused SAT regression tests
        run: |
          bazel test --config=ci \
            //ortools/sat:sat_solver_clause_cleanup_test \
            //ortools/sat:sat_inprocessing_test \
            //ortools/sat:clause_test \
            //ortools/sat:cp_model_solver_test
