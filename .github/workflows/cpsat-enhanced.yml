name: CP-SAT AllDifferent focused test

on:
  push:
    branches:
      - cpsat-enhanced-v9.15

jobs:
  all_different_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bazel
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg openjdk-17-jdk
          curl -fsSL https://releases.bazel.build/bazel-release.pub.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/bazel-archive-keyring.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list
          sudo apt-get update
          sudo apt-get install -y bazel
      - name: Check Bazel
        run: bazel version
      - name: Run AllDifferent regression tests
        run: bazel --output_user_root=/tmp/bazel test --config=ci //ortools/sat:all_different_test
