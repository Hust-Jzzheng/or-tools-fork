name: CP-SAT kernel regression and MiniZinc smoke

on:
  push:
    branches:
      - cpsat-enhanced-v9.15

concurrency:
  group: cpsat-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all_different_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Bazel 8.5.0
        run: |
          curl -fsSL -o /tmp/bazel-bin https://github.com/bazelbuild/bazel/releases/download/8.5.0/bazel-8.5.0-linux-x86_64
          sudo install -m 0755 /tmp/bazel-bin /usr/local/bin/bazel
      - name: Validate MiniZinc benchmark harness
        run: |
          python3 -m py_compile benchmarks/minizinc2026/run_benchmark.py
          python3 -m py_compile benchmarks/minizinc2026/compare_results.py
          bash -n benchmarks/minizinc2026/build_solver.sh
          bash -n benchmarks/minizinc2026/build_both.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("benchmarks/minizinc2026/manifest.json").read_text())
          assert manifest["dataset"]["model_count"] == 20
          assert manifest["dataset"]["instance_count"] == 100
          assert len(manifest["instances"]) == 100
          assert manifest["dataset"]["data_files"] == {"dzn": 70, "json": 30}
          assert len({item["id"] for item in manifest["instances"]}) == 100
          assert len({item["model"] for item in manifest["instances"]}) == 20
          print("MiniZinc 2026 manifest validated: 20 models / 100 instances")
          PY
      - name: Check Bazel
        run: bazel version
      - name: Run SAT and CP-SAT regression tests
        run: |
          bazel --output_user_root=/tmp/bazel-root test --config=ci \
            //ortools/sat:all_different_test \
            //ortools/sat:clause_test \
            //ortools/sat:sat_inprocessing_test \
            //ortools/sat:cp_model_solver_test

  minizinc_2026_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: minizinc/mznc2026:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git python3 unzip
      - name: Install pinned Bazel 8.5.0
        run: |
          curl -fsSL -o /tmp/bazel-bin https://github.com/bazelbuild/bazel/releases/download/8.5.0/bazel-8.5.0-linux-x86_64
          install -m 0755 /tmp/bazel-bin /usr/local/bin/bazel
          bazel version
      - name: Build FlatZinc CP-SAT
        run: bazel build --compilation_mode=opt //ortools/flatzinc:fz
      - name: Fetch pinned MiniZinc 2026 archive
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/MiniZinc/mzn-challenge.git /tmp/mzn-challenge
          git -C /tmp/mzn-challenge checkout 7639931e89b6b8bba48ef129d52fba866bc36702
      - name: Run one 12-worker smoke instance
        run: |
          python3 benchmarks/minizinc2026/run_benchmark.py \
            --dataset-root /tmp/mzn-challenge \
            --repo-root "$GITHUB_WORKSPACE" \
            --fz-bin "$GITHUB_WORKSPACE/bazel-bin/ortools/flatzinc/fz" \
            --results-dir /tmp/minizinc2026-smoke \
            --threads 12 --time-limit 30 --seed 1 --limit 1
