name: CP-SAT AllDifferent focused test

on:
  push:
    branches:
      - cpsat-enhanced-v9.15

jobs:
  all_different_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Bazel 8.5.0
        run: |
          curl -fsSL -o /tmp/bazel https://github.com/bazelbuild/bazel/releases/download/8.5.0/bazel-8.5.0-linux-x86_64
          sudo install -m 0755 /tmp/bazel /usr/local/bin/bazel
      - name: Check Bazel
        run: bazel version
      - name: Run AllDifferent regression tests
        run: bazel --output_user_root=/tmp/bazel test --config=ci //ortools/sat:all_different_test
